# oc apply -k deploy/openshift
# The Secret and the CA ConfigMap are created separately (see README) so that
# no credentials live in this directory. job-ops.yaml is used with "oc create -f".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odf-backup
resources:
  - configmap.yaml
  - pvc.yaml
  - build.yaml
  - cronjob.yaml
